<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In – DreamCoach</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #004d40 0%, #00695c 100%); min-height: 100vh; }
    .auth-card { max-width: 460px; margin: 60px auto; border-radius: 16px !important; }
    .auth-header { text-align: center; padding: 32px 24px 8px; }
    .auth-header h4 { font-family: 'Merriweather', serif; color: #00695c; }
    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      color: #424242;
      transition: background 0.2s;
      margin-bottom: 20px;
    }
    .google-btn:hover { background: #f5f5f5; }
    .google-btn img { width: 20px; height: 20px; }
    .divider-text {
      text-align: center;
      color: #9e9e9e;
      margin: 16px 0;
      position: relative;
      font-size: 0.85rem;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e0e0e0;
    }
    .divider-text::before { left: 0; }
    .divider-text::after  { right: 0; }
  </style>
</head>
<body>

<div class="container">
  <div class="card auth-card">
    <div class="auth-header">
      <span style="font-size:3rem;">🌙</span>
      <h4>DreamCoach</h4>
      <p class="grey-text">Sign in to analyze your dreams</p>
    </div>

    <div class="card-content">
      <!-- Tab selector -->
      <ul class="tabs" id="authTabs">
        <li class="tab col s6"><a href="#signin" class="active">Sign In</a></li>
        <li class="tab col s6"><a href="#signup">Create Account</a></li>
      </ul>

      <!-- Google Sign-In -->
      <div style="margin-top:24px;">
        <button class="google-btn" id="googleBtn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
          Continue with Google
        </button>
        <div class="divider-text">or</div>
      </div>

      <!-- Sign In Tab -->
      <div id="signin">
        <form id="signinForm">
          <div class="input-field">
            <input id="si-email" type="email" required>
            <label for="si-email">Email</label>
          </div>
          <div class="input-field">
            <input id="si-password" type="password" required minlength="6">
            <label for="si-password">Password</label>
          </div>
          <button class="btn-large waves-effect waves-light teal darken-2 full-width" type="submit"
            style="width:100%; font-family:'Merriweather',serif; margin-top:8px;">
            Sign In<i class="material-icons right">login</i>
          </button>
        </form>
      </div>

      <!-- Sign Up Tab -->
      <div id="signup">
        <form id="signupForm">
          <div class="input-field">
            <input id="su-name" type="text" required>
            <label for="su-name">Full Name</label>
          </div>
          <div class="input-field">
            <input id="su-email" type="email" required>
            <label for="su-email">Email</label>
          </div>
          <div class="input-field">
            <input id="su-password" type="password" required minlength="6">
            <label for="su-password">Password (min 6 characters)</label>
          </div>
          <button class="btn-large waves-effect waves-light teal darken-2" type="submit"
            style="width:100%; font-family:'Merriweather',serif; margin-top:8px;">
            Create Account<i class="material-icons right">person_add</i>
          </button>
        </form>
      </div>

      <p class="center grey-text" style="margin-top:20px; font-size:0.8rem;">
        By signing in you agree to our
        <a href="#" class="teal-text text-darken-2">Terms of Service</a> and
        <a href="#" class="teal-text text-darken-2">Privacy Policy</a>.
      </p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script type="module">
  import { initAuthGuard, signInWithGoogle, signInWithEmail, signUpWithEmail } from './js/auth.js';

  M.AutoInit();

  // Redirect if already logged in
  initAuthGuard(null);

  function getAuthErrorMessage(code) {
    const msgs = {
      'auth/user-not-found':      'No account found with this email.',
      'auth/wrong-password':      'Incorrect password.',
      'auth/email-already-in-use':'An account with this email already exists.',
      'auth/weak-password':       'Password must be at least 6 characters.',
      'auth/invalid-email':       'Please enter a valid email address.',
      'auth/too-many-requests':   'Too many attempts. Please try again later.',
      'auth/popup-closed-by-user':'Sign-in popup was closed. Please try again.'
    };
    return msgs[code] || 'Authentication failed. Please try again.';
  }

  // Google sign-in
  document.getElementById('googleBtn').addEventListener('click', async () => {
    try {
      await signInWithGoogle();
      const ret = sessionStorage.getItem('returnUrl');
      sessionStorage.removeItem('returnUrl');
      location.href = ret || '/dashboard.html';
    } catch (err) {
      M.toast({ html: getAuthErrorMessage(err.code), classes: 'red darken-2' });
    }
  });

  // Email sign-in
  document.getElementById('signinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('si-email').value;
    const password = document.getElementById('si-password').value;
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await signInWithEmail(email, password);
      const ret = sessionStorage.getItem('returnUrl');
      sessionStorage.removeItem('returnUrl');
      location.href = ret || '/dashboard.html';
    } catch (err) {
      M.toast({ html: getAuthErrorMessage(err.code), classes: 'red darken-2' });
      btn.disabled = false; btn.innerHTML = 'Sign In<i class="material-icons right">login</i>';
    }
  });

  // Email sign-up
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name     = document.getElementById('su-name').value;
    const email    = document.getElementById('su-email').value;
    const password = document.getElementById('su-password').value;
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      await signUpWithEmail(email, password, name);
      M.toast({ html: '🎉 Account created! Welcome to DreamCoach.', classes: 'teal darken-2' });
      setTimeout(() => { location.href = '/dashboard.html'; }, 1200);
    } catch (err) {
      M.toast({ html: getAuthErrorMessage(err.code), classes: 'red darken-2' });
      btn.disabled = false; btn.innerHTML = 'Create Account<i class="material-icons right">person_add</i>';
    }
  });
</script>
</body>
</html>
